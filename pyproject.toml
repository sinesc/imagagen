[project]
name = "imagagen"
version = "0.1.0"
description = "AI image generator with a unified canvas"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10",
    "numpy>=2",
    "pydantic>=2",
    "torch>=2.13.0",
    "diffusers>=0.40.0",
    "accelerate>=1.15.0",
    "transformers>=5.17.0",
    "safetensors>=0.8.0",
    "peft>=0.10.0",
    "bitsandbytes>=0.50.2",
    "scipy>=1.11",
    "torchsde>=0.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "httpx>=0.27",
    "ruff>=0.8",
]

[project.scripts]
imagagen = "imagagen.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imagagen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# vendored k-diffusion code keeps upstream line style
"src/imagagen/kdiff.py" = ["E501"]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu129" }

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "websockets>=17.1",
]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>imagagen</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="layout">
    <aside id="controls">
      <div class="row bottom-row">
        <label title="preset: applies the checked settings of the selected preset on select">Preset
          <span id="preset"></span>
        </label>
        <button id="preset-manage" class="mini icon" title="create/edit/delete setting presets">⚙</button>
      </div>
      <div class="row model-row">
        <label>Model
          <span id="model"></span>
        </label>
        <span class="mini-btns" title="model configurations">
          <button id="cfg-create" class="mini icon" title="create a new model configuration (copy of the selected one)">+</button>
          <button id="cfg-edit" class="mini icon" title="edit the selected model configuration">✎</button>
          <button id="cfg-delete" class="mini icon" title="delete the selected model configuration (in-memory defaults cannot be deleted)">✗</button>
        </span>
      </div>
      <div class="row">
        <label class="cfg-slot" title="-1 = use the model default (the configuration's value, then the model built-in)">CFG <input id="cfg" type="number" value="-1" min="-1" step="0.1"></label>
        <label class="steps-slot" title="-1 = use the model default (the configuration's value, then the model built-in)">Steps <input id="steps" type="number" value="-1" min="-1" max="150"></label>
        <label class="seed-slot">Seed <input id="seed" type="number" value="-1" title="-1 = random"></label>
        <button id="seed-reset" class="mini icon" title="reset the seed to -1 (a new random seed for every image)">↺</button>
        <button id="seed-from-image" class="mini icon" title="copy the seed of the currently selected image into the seed field">⚄</button>
      </div>
      <div class="row">
        <label>Sampler <select id="sampler"><option value="">Model default</option></select></label>
        <label>Scheduler <select id="scheduler"><option value="">Model default</option></select></label>
      </div>
      <div class="row">
        <label title="LoRAs (loras/<model-type>/) are used in addition to the model configuration's LoRAs, which are always prepended">LoRAs
          <span class="loras">
            <span id="loras" class="lora-list"></span>
            <span class="mini-btns">
              <button id="lora-add" type="button" class="mini" title="add a LoRA">+ LoRA</button>
              <button id="lora-manage" class="mini icon" title="LoRA configuration (edit the settings of available LoRAs)">⚙</button>
            </span>
          </span>
        </label>
      </div>
      <div class="row">
        <label title="Styles (styles.csv), applied to the prompt in list order before generation: a style's {prompt} placeholder is replaced by the prompt so far, otherwise the style text is appended">Styles
          <span class="styles">
            <span id="styles" class="style-list"></span>
            <span class="mini-btns">
              <button id="style-add" type="button" class="mini" title="add a style">+ Style</button>
              <button id="style-manage" class="mini icon" title="style configuration (create / edit / delete styles in styles.csv)">⚙</button>
            </span>
          </span>
        </label>
      </div>
      <div class="row dims-row">
        <label class="dims" title="-1 = auto: mask bounding box, scaled by Scale, rounded up to a multiple of 16 and raised to a 1024 min side (AR preserved; Inpaint/Outpaint only)">Width <input id="width" type="number" value="1024" min="64" max="4096" step="8"></label>
        <button id="swap-dims" type="button" class="mini icon" title="swap width and height">↔</button>
        <label class="dims" title="-1 = auto: mask bounding box, scaled by Scale, rounded up to a multiple of 16 and raised to a 1024 min side (AR preserved; Inpaint/Outpaint only)">Height <input id="height" type="number" value="1024" min="64" max="4096" step="8"></label>
        <label class="trio" title="scale the generation size (user-specified or mask-derived) before rounding up to a multiple of 16; auto-computed (-1) sizes are additionally raised to a 1024 min side with the other dimension scaled to keep the aspect ratio (Inpaint/Outpaint only)">Scale
          <input id="oversample" type="number" value="1" min="0.1" max="4" step="0.05" disabled>
        </label>
        <label class="trio" title="rotate the source before generating and counter-rotate the result: the model always sees upright content (+ = clockwise); ±45°/±135° extend the generation size so the rotated image fits">Rotate
          <select id="rotation">
            <option value="-180">-180°</option>
            <option value="-135">-135°</option>
            <option value="-90">-90°</option>
            <option value="-45">-45°</option>
            <option value="0" selected>0°</option>
            <option value="45">+45°</option>
            <option value="90">+90°</option>
            <option value="135">+135°</option>
            <option value="180">+180°</option>
          </select>
        </label>
        <label class="trio">Batch <input id="batch" type="number" value="1" min="1" max="32"></label>
      </div>
      <div class="row">
        <label class="mode-label" title="Generate: new image — Inpaint: regenerate the masked area — Outpaint: regenerate the whole image (img2img/outpaint), masked content protected">
          Mode
          <select id="mode">
            <option value="generate">Generate</option>
            <option value="inpaint_masked">Inpaint</option>
            <option value="inpaint_not_masked">Outpaint</option>
          </select>
        </label>
        <label title="context padding around the masked area, canvas px per side (Inpaint only)">Mask pad
          <input id="mask-padding" type="number" value="8" min="0" max="2048" step="8" disabled>
        </label>
        <label title="denoising strength (inpaint modes only)">Denoise
          <input id="denoise" type="number" value="1" min="0" max="1" step="0.01" disabled>
        </label>
      </div>
      <div class="row actions">
        <button id="btn-generate" class="primary" title="Generate image (Ctrl+G)">Generate</button>
        <button id="btn-save" title="Save current canvas image (Ctrl+S)">Save</button>
      </div>
      <div id="progress-wrap">
        <div id="progress-bar"><div id="progress-fill"></div><div id="progress-label" class="muted"></div></div>
      </div>
      <div id="thumbs" hidden></div>
    </aside>

    <div id="sidebar-resizer" title="drag to resize the sidebar"></div>

    <main id="stage">
      <div id="prompts">
        <label>
          <span class="prompt-head">
            <span>Prompt</span>
            <span id="prompt-tokens" class="muted" title="CLIP tokens of the prompt with selected styles applied (75 per window); a prompt longer than one window is split across several"></span>
          </span>
          <textarea id="prompt" placeholder="Enter a prompt or drag a previously generated image here. Everything after # on a line is ignored."></textarea>
        </label>
        <textarea id="negative" placeholder="Negative prompt"></textarea>
        <div id="ref-sections" class="hidden" title="caption sections the reference image injects into the prompt"></div>
      </div>
      <div id="toolbar">
        <button id="tool-brush" class="tool active mini" title="draw tool (D); hold ctrl to pick the canvas colour at the cursor; with a floating selection active, shift draws as an eraser"><u>D</u>raw</button>
        <label class="slab" title="brush colour (mask strokes ignore it)">
          <input id="brush-color" type="color" value="#ffffff">
        </label>
        <span class="sep"></span>
        <button id="tool-smudge" class="tool mini" title="smudge tool (S); drag to smear/blur (smudge is sequential: each stamp drags the pixels the previous one moved)"><u>S</u>mudge</button>
        <button id="tool-clone" class="tool mini" title="clone tool (C); ctrl-click to pick the source, hold shift to drag it around, then drag to copy (with a floating selection active it samples that selection)"><u>C</u>lone</button>
        <button id="tool-mask" class="tool mini" title="mask tool (M); draw with shift held to erase"><u>M</u>ask</button>
        <span class="sep"></span>
        <select id="brush" title="brush shape (greyscale png from brushes/)"></select>
        <label class="slab" title="brush size, logarithmic 10–500 px (canvas px; screen px when 'screen' is checked; Ctrl+mouse wheel adjusts it)">
          <span>Size</span>
          <input id="brush-size" type="range" min="0" max="1" step="0.001" value="0">
          <b id="brush-size-val">10</b>
        </label>
        <label class="slab tight" title="size in screen px: stays the same on screen while zooming (unchecked = size in canvas px)">
          <span>Screen</span>
          <input id="brush-screen" type="checkbox">
        </label>
        <label class="slab" title="brush opacity (Shift+mouse wheel adjusts it)">
          <span>Opacity</span>
          <input id="brush-opacity" type="range" min="0.05" max="1" step="0.01" value="1">
          <b id="brush-opacity-val">1.00</b>
        </label>
        <span class="sep"></span>
        <label class="slab num">Mask px
          <input id="mask-px" type="number" value="4" min="0" max="100">
        </label>
        <button id="mask-dilate" class="mini" title="expand the mask by the given pixels (N)">Expa<u>n</u>d</button>
        <button id="mask-erode" class="mini" title="shrink the mask by the given pixels (K)">Shrin<u>k</u></button>
        <button id="mask-clear" class="mini" title="clear the whole mask (R)">Clea<u>r</u></button>
        <button id="seg-run" class="mini" title="generate a person mask from the current image: pick the model, the body-part classes, the confidence threshold and the edge feather; the result is added to the mask buffer (union, undoable)">Segment</button>
        <span class="sep"></span>
        <button id="tool-crop" class="tool mini" title="crop tool (P); drag a rectangle to crop the displayed image (Esc while dragging aborts); with a floating selection active it crops that selection">Cro<u>p</u></button>
        <button id="tool-copy" class="tool mini" title="copy tool (Y); drag a rectangle to copy that area of the image (Esc while dragging aborts)">Cop<u>y</u></button>
        <button id="tool-paste" class="tool mini" title="paste tool (E); click to drop the copied area as a floating selection; while one is active, drag inside it to move it, and apply or discard it before dropping a new one (Enter applies, Esc discards, the arrows flip it)">Past<u>e</u></button>
        <span class="sep"></span>
        <button id="zoom-in" class="mini icon" title="zoom in (also: mouse wheel)">+</button>
        <button id="zoom-out" class="mini icon" title="zoom out">−</button>
        <button id="zoom-fit" class="mini" title="fit image to window (F)"><u>F</u>it</button>
        <span id="zoom-label" class="muted"></span>
        <span id="status-line" class="muted"></span>
        <button id="btn-undo" class="mini" title="undo (Ctrl+Z; label + target follow the active tool)" disabled>↩ Undo draw</button>
        <button id="btn-redo" class="mini" title="redo (Ctrl+Y; label + target follow the active tool)" disabled>↪ Redo draw</button>
      </div>
      <div id="canvas-holder">
        <canvas id="canvas" hidden></canvas>
        <div id="thumb-preview" hidden><img id="thumb-preview-img" alt="" draggable="false"></div>
        <div id="canvas-empty" class="muted">empty — generate or drop a PNG here (or onto the prompt fields to import its metadata)</div>
        <div id="sel-actions" hidden>
          <button id="sel-flip-h" class="mini" title="flip the floating selection horizontally">↔<span class="sel-word"> H-flip</span></button>
          <button id="sel-ok" class="mini" title="apply the floating selection to the image (Enter)">✓<span class="sel-word"> Apply</span></button>
          <button id="sel-cancel" class="mini" title="discard the floating selection (Esc)">✕<span class="sel-word"> Cancel</span></button>
          <button id="sel-flip-v" class="mini" title="flip the floating selection vertically">↕<span class="sel-word"> V-flip</span></button>
        </div>
      </div>
    </main>
  </div>

  <!-- covers the UI until the first websocket connection is up (app.js
       hides it on ws.onopen) -->
  <div id="loading-overlay">loading…</div>

  <div id="dialog" hidden>
    <div id="dialog-box">
      <div id="dialog-title-row">
        <h3 id="dialog-title"></h3>
        <div id="dialog-filter" hidden></div>
      </div>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button id="dialog-cancel">Cancel</button>
        <button id="dialog-ok" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script src="/ui-elements.js"></script>
  <script src="/tools.js"></script>
  <script src="/canvas.js"></script>
  <script src="/app.js"></script>
</body>
</html>

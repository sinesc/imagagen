<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>imagagen</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="layout">
    <aside id="controls">
      <div class="row model-row">
        <label>Model
          <select id="model"></select>
        </label>
        <span class="mini-btns" title="model configurations">
          <button id="cfg-create" class="mini icon" title="create a new model configuration (copy of the selected one)">+</button>
          <button id="cfg-edit" class="mini icon" title="edit the selected model configuration">✎</button>
          <button id="cfg-delete" class="mini icon" title="delete the selected model configuration (in-memory defaults cannot be deleted)">✗</button>
        </span>
      </div>
      <div class="row bottom-row">
        <label title="preset: applies the checked settings of the selected preset on select">Preset
          <select id="preset"><option value="">—</option></select>
        </label>
        <button id="preset-manage" class="mini icon" title="create/edit/delete setting presets">⚙</button>
      </div>
      <div class="row">
        <label title="-1 = use the model configuration's CFG">CFG <input id="cfg" type="number" value="7" min="-1" step="0.1"></label>
        <label>Seed <input id="seed" type="number" value="-1" title="-1 = random"></label>
        <label title="-1 = use the model configuration's steps">Steps <input id="steps" type="number" value="25" min="-1" max="150"></label>
      </div>
      <div class="row">
        <label>Sampler <select id="sampler"><option value="">Model default</option></select></label>
        <label>Scheduler <select id="scheduler"><option value="">Model default</option></select></label>
      </div>
      <div class="row">
        <label title="LoRAs (loras/<model-type>/) are used in addition to the model configuration's LoRAs, which are always prepended">LoRAs
          <span class="loras">
            <span id="loras" class="lora-list"></span>
            <button id="lora-add" type="button" class="mini" title="add a LoRA">+ LoRA</button>
          </span>
        </label>
      </div>
      <div class="row">
        <label title="Styles (styles.csv), applied to the prompt in list order before generation: a style's {prompt} placeholder is replaced by the prompt so far, otherwise the style text is appended">Styles
          <span class="styles">
            <span id="styles" class="style-list"></span>
            <span class="mini-btns">
              <button id="style-add" type="button" class="mini" title="add a style">+ Style</button>
              <button id="style-manage" class="mini icon" title="style configuration (create / edit / delete styles in styles.csv)">⚙</button>
            </span>
          </span>
        </label>
      </div>
      <div class="row">
        <label class="dims">Width <input id="width" type="number" value="1024" min="64" max="2048" step="8"></label>
        <button id="swap-dims" type="button" class="mini icon" title="swap width and height">↔</button>
        <label class="dims">Height <input id="height" type="number" value="1024" min="64" max="2048" step="8"></label>
        <label>Batch <input id="batch" type="number" value="1" min="1" max="32"></label>
      </div>
      <div class="row">
        <label class="mode-label" title="Generate: new image — Inpaint: regenerate the masked area — Outpaint: regenerate the whole image (img2img/outpaint), masked content protected">
          Mode
          <select id="mode">
            <option value="generate">Generate</option>
            <option value="inpaint_masked">Inpaint</option>
            <option value="inpaint_not_masked">Outpaint</option>
          </select>
        </label>
        <label title="context padding around the masked area, canvas px per side (Inpaint only)">Mask pad
          <input id="mask-padding" type="number" value="256" min="0" max="2048" step="8" disabled>
        </label>
        <label title="denoising strength (inpaint modes only)">Denoise
          <input id="denoise" type="number" value="1" min="0" max="1" step="0.01" disabled>
        </label>
      </div>
      <div class="row actions">
        <button id="btn-generate" class="primary">Generate</button>
        <button id="btn-save">Save</button>
      </div>
      <div id="progress-wrap">
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="progress-label" class="muted"></div>
      </div>
      <div id="thumbs" hidden></div>
    </aside>

    <main id="stage">
      <div id="prompts">
        <label>Prompt
          <textarea id="prompt" placeholder="a photo of a frog"></textarea>
        </label>
        <textarea id="negative" placeholder="Negative prompt"></textarea>
      </div>
      <div id="toolbar">
        <button id="tool-brush" class="tool active" title="brush tool (B)">brush</button>
        <button id="tool-mask" class="tool" title="mask tool (M); draw with shift held to erase">mask</button>
        <select id="brush" title="brush shape (greyscale png from brushes/)"></select>
        <label class="slab" title="brush colour (mask strokes ignore it)">
          <span>colour</span>
          <input id="brush-color" type="color" value="#ffffff">
        </label>
        <label class="slab" title="brush size, logarithmic 1–300 px (canvas px; screen px when 'screen' is checked)">
          <span>size</span>
          <input id="brush-size" type="range" min="0" max="1" step="0.001" value="0.404">
          <b id="brush-size-val">10</b>
        </label>
        <label class="slab tight" title="size in screen px: stays the same on screen while zooming (unchecked = size in canvas px)">
          <span>screen</span>
          <input id="brush-screen" type="checkbox">
        </label>
        <label class="slab" title="brush opacity">
          <span>opacity</span>
          <input id="brush-opacity" type="range" min="0.05" max="1" step="0.01" value="1">
          <b id="brush-opacity-val">1.00</b>
        </label>
        <span class="sep"></span>
        <label class="slab num">mask px
          <input id="mask-px" type="number" value="4" min="0" max="100">
        </label>
        <button id="mask-dilate" title="expand the mask by the given pixels">expand</button>
        <button id="mask-erode" title="shrink the mask by the given pixels">shrink</button>
        <button id="mask-clear" title="clear the whole mask">clear mask</button>
        <span class="sep"></span>
        <select id="seg-model" title="segmentation model (tflite file from models/segmentation/)"></select>
        <button id="seg-run" title="generate a person mask (selected body-part classes) from the current image, added to the mask buffer (union, undoable)">segment</button>
        <span class="sep"></span>
        <button id="zoom-in" title="zoom in (also: mouse wheel)">+</button>
        <button id="zoom-out" title="zoom out">−</button>
        <button id="zoom-fit" title="fit image to window (also: double-click)">fit</button>
        <span id="zoom-label" class="muted"></span>
        <span id="status-line" class="muted"></span>
        <button id="btn-undo" title="undo (canvas changes)">↩ undo</button>
        <button id="btn-redo" title="redo">↪ redo</button>
      </div>
      <div id="canvas-holder">
        <canvas id="canvas" hidden></canvas>
        <div id="canvas-empty" class="muted">empty — generate or drop a PNG here (or onto the prompt fields to import its metadata)</div>
      </div>
    </main>
  </div>

  <div id="dialog" hidden>
    <div id="dialog-box">
      <h3 id="dialog-title"></h3>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button id="dialog-cancel">Cancel</button>
        <button id="dialog-ok" class="primary">Save</button>
      </div>
    </div>
  </div>

  <script src="/tools.js"></script>
  <script src="/canvas.js"></script>
  <script src="/app.js"></script>
</body>
</html>
